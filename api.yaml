      type: object
      properties:
        username:
          type: boolean
          example: true
        password:
          type: boolean
          example: false
      x-swagger-mongoose:
        exclude-schema: true
    link_accounts:
      required:
      - main
      - secondary
      type: object
      properties:
        main:
          type: string
          example: JWT of the main account
        secondary:
          type: string
          example: JWT of the secondary account
        domain:
          type: string
          example: moodle_12321
      x-swagger-mongoose:
        exclude-schema: true
