security:
  - OAuth2.0:
      - openid
      - profile
      - email
components:
  securitySchemes:
    OAuth2.0:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://sso.simva-beta2.e-ucm.es/realms/simva/protocol/openid-connect/auth
          tokenUrl: https://sso.simva-beta2.e-ucm.es/realms/simva/protocol/openid-connect/token
          scopes:
            openid: Grants access to the OpenID Connect ID token
            profile: Grants access to the user's profile information
            email: Grants access to the user's email address
      x-client-id: "{{clientId}}"
      x-client-secret: "{{clientSecret}}"
      x-callback-url: "https://oauth.pstmn.io/v1/callback"
  parameters:
    userId:
      in: path
      name: userid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The user ID
    groupId:
      in: path
      name: groupid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The group ID
    usernamePath:
      name: username
      in: path
      required: true
      schema:
        type: string
        example: "peter"
        format: username
      description: The username of a specific user
    usernameQuery:
      name: username
      in: query
      required: true
      schema:
        type: string
        example: "peter"
        format: username
      description: The username of a specific user
    allQuery:
      name: all
      in: query
      required: false
      schema:
        type: string
        example: "full"
      description: The type of the Limesurvey result
    simletId:
      in: path
      name: simletid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The SIMLET ID
    sessionId:
      in: path
      name: sessionid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The session ID
    activityId:
      in: path
      name: activityid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The activity ID
    surveyId:
      in: path
      name: surveyid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The survey ID
    extensionId:
      in: path
      name: extension_id
      required: true
      schema:
        type: string
      description: Extension identifier
    tagId:
      in: path
      name: tagid
      required: true
      schema:
        type: integer
      description: The tag ID
    ltiToolId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702b2"
      description: The lti_tool ID
    ltiPlatformId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702b2"
      description: The lti platform ID
    contextId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702af"
      description: The context id
    lineItem:
      in: path
      name: lineitem
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702af"
      description: The id of the line item
    searchString:
      in: query
      name: searchString
      description: pass an optional search string for result filtering
      required: false
      schema:
        type: string
    skip:
      in: query
      name: skip
      description: number of records to skip for pagination
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    limit:
      in: query
      name: limit
      description: maximum number of records to return
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 50
    user:
      in: query
      name: user
      description: |
        the user to get its completion status
        (if logged in student , user is not needed)
      schema:
        type: string
        format: 'user1'
    users:
      in: query
      name: users
      description: |
        the list of users comma separated or none for all
        (if logged in student , user is not needed)
      schema:
        type: string
        example: 'user1,user2,user3'
    type:
      in: query
      name: type
      description: |
        If the activity has multiple types of results, the
        type of result can be specified here
      required: false
      schema:
        type: string
        example: 'results'
    time:
      in: query
      name: time
      description: |
        milliseconds to return
      required: false
      schema:
        type: integer
        format: '2000'
    completionQuery:
      in: query
      name: complete
      description: |
        If true, the completion status of the activity will be returned
      required: false
      schema:
        type: boolean
    lti_login_hint:
      in: query
      name: lti_login_hint
      description: simva signed JWT token with LTI-login data
      required: false
      schema:
        type: string
    lti_message_hint:
      in: query
      name: lti_message_hint
      description: simva signed JWT token with LTI-related data
      required: false
      schema:
        type: string
    use_new_generation:
      in: query
      name: use_new_generation
      required: false
      schema:
        type: boolean
      description: |
        If true, the new generation of groups will be used
    keycloakDelete:
      in: query
      name: keycloakDelete
      description: |
        If true, the user will be deleted also in keycloak. Only for testing purposes
      schema:
        type: boolean
    lrsMore:
      name: more
      in: query
      required: false
      schema:
        type: string
      description: Return more statements using this URL provided in the "more" property of the response
    lrsAgent:
      name: agent
      in: query
      required: false
      schema:
        type: string
      description: Filter statements by agent or identified group
    lrsAttachments:
      name: attachments
      in: query
      required: false
      schema:
        type: boolean
      description: Include attachments in the response
    lrsAscending:
      name: ascending
      in: query
      required: false
      schema:
        type: boolean
      description: Return statements in ascending stored-time order
    lrsFormat:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum:
          - ids
          - exact
          - canonical
      description: Statement representation format
    lrsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Maximum number of xAPI statements to return
    lrsRelatedAgents:
      name: related_agents
      in: query
      required: false
      schema:
        type: boolean
      description: Include statements related to matching agents
    lrsRegistration:
      name: registration
      in: query
      required: false
      schema:
        type: string
      description: Filter statements by registration UUID
    lrsSince:
      name: since
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Return statements stored since this timestamp
    lrsStatementId:
      name: statementId
      in: query
      required: false
      schema:
        type: string
      description: Id of Statement to fetch
    lrsUntil:
      name: until
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Return statements stored at or before this timestamp
    lrsVerb:
      name: verb
      in: query
      required: false
      schema:
        type: string
      description: Filter statements by verb IRI
    lrsVoidedStatementId:
      name: voidedStatementId
      in: query
      required: false
      schema:
        type: string
      description: Id of voided Statement to fetch
    lrsActivity:
        name: activity
        in: query
        required: false
        schema:
          type: string
        description: The activity IRI to filter xAPI statements
    lrsRelatedActivities:
        name: related_activities
        in: query
        required: false
        schema:
          type: boolean
        description: Include statements related to the specified activity
    lrsFrom:
        name: from
        in: query
        required: false
        schema:
          type: string
        description: Pagination cursor returned by the xAPI statement endpoint
  responses:
    HealthCheckSuccess:
      description: Health check successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/health_check_response'
    AuthentificationError:
      description: Authentification error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    BadRequestError:
      description: Bad request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    ConflictError:
      description: Conflict error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    NotFoundError:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    NotImplementedError:
      description: Not implemented method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  schemas:
    health_check_response:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: boolean
          example: true
        db:
          type: object
          required:
            - status
          properties:
            status:
              type: boolean
              example: true
    error:
      description: An error occurred
      type: object
      required:
        - type
        - message
        - stack
        - name
      properties:
        type:
          type: string
          example: "Error"
        message:
          type: string
          example: "An error occurred"
        stack:
          type: string
          example: "Error: An error occurred at ... "
        name:
          type: string
          example: "Error"
    upload_file:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
    events:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          example: eventname
          description: |
            The event name.
    user:
      type: object
      properties:
        username:
          type: string
          example: "username_unique"
        isToken:
          type: boolean
          example: false
        token:
          type: string
          nullable: true
          example: "user"
        email:
          type: string
          example: "email@example.com"
        role:
          type: string
          description: |
            The role for the user to have. Some
            examples include teacher, student 
            teaching-assistant or researcher
          enum:
           - "norole"
           - "student"
           - "teacher"
           - "teaching-assistant"
           - "researcher"
           - "administrator"
           - "lrsmanager"
    tokenCreation:
      allOf:
        - $ref: '#/components/schemas/user'
        - type: object
          required:
            - isToken
            - token
            - role
    userPasswordCreation:
      allOf:
        - $ref: '#/components/schemas/user'
        - type: object
          properties:
            password:
              type: string
              example: "Pass12345"
          required:
            - username
            - isToken
            - email
            - role
    userCreation:
      oneOf:
        - $ref: '#/components/schemas/tokenCreation'
        - $ref: '#/components/schemas/userPasswordCreation'
    userMapper:
      allOf:
       - $ref: '#/components/schemas/user'
       - type: object
         properties:
          user_id:
            type: integer
            example: 123
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
         required:
          - user_id
          - username
          - isToken
          - token
          - email
          - role
          - createdAt
          - updatedAt
    userPermission:
      type: object
