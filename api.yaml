        properties:
          survey_id:
            type: integer
            example: 789
          survey_language:
            type: string
            example: "en"
    limesurveyActivityCreation:
      allOf:
      - $ref: '#/components/schemas/limesurveyActivity'
      - $ref: '#/components/schemas/noTypedActivityCreation'
      - type: object
        required:
        - survey_id
        - survey_language
    manualActivity:
      allOf:
      - $ref: '#/components/schemas/noTypedActivity'
      - type: object
        properties:
          manual_user_managed:
            type: boolean
            example: true
          manual_ressource_type:
            type: string
            enum: ["WEB", "EXTERNAL"]
            example: "WEB"
          manual_ressource_url:
            type: string
            example: "https://example.com/manual-activity-resource"
    manualActivityCreation:
      allOf:
      - $ref: '#/components/schemas/manualActivity'
      - $ref: '#/components/schemas/noTypedActivityCreation'
      - type: object
        required:
        - manual_user_managed
        - manual_ressource_type
        - manual_ressource_url
    gameplayActivity:
      allOf:
      - $ref: '#/components/schemas/noTypedActivity'
      - type: object
        properties:
          game_backup:
            type: boolean
            example: false
          game_scorm_xapi:
            type: boolean
            example: false
          game_type:
            type: string
            enum: ["WEB", "DESKTOP"]
            example: "WEB"
          game_url:
            type: string
            example: "https://example.com/gameplay-activity-resource"
    gameplayActivityCreation:
      allOf:
      - $ref: '#/components/schemas/gameplayActivity'
      - $ref: '#/components/schemas/noTypedActivityCreation'
      - type: object
        required:
        - game_type
        - game_url
    limesurveyActivityMapper:
      allOf:
      - $ref: '#/components/schemas/limesurveyActivity'
      - $ref: '#/components/schemas/noTypedActivityMapper'
      - type: object
        required:
        - survey_id
        - survey_language
    manualActivityMapper:
      allOf:
      - $ref: '#/components/schemas/manualActivity'
      - $ref: '#/components/schemas/noTypedActivityMapper'
      - type: object
        required:
        - manual_user_managed
        - manual_ressource_type
        - manual_ressource_url
    gameplayActivityMapper:
      allOf:
      - $ref: '#/components/schemas/gameplayActivity'
      - $ref: '#/components/schemas/noTypedActivityMapper'
      - type: object
        required:
        - game_backup
        - game_scorm_xapi
        - game_type
        - game_url
    activity:
      anyOf:
      - $ref: '#/components/schemas/limesurveyActivity'
      - $ref: '#/components/schemas/manualActivity'
      - $ref: '#/components/schemas/gameplayActivity'
    activityCreation:
      anyOf:
      - $ref: '#/components/schemas/limesurveyActivityCreation'
      - $ref: '#/components/schemas/manualActivityCreation'
      - $ref: '#/components/schemas/gameplayActivityCreation'
    activityMapper:
      anyOf:
      - $ref: '#/components/schemas/limesurveyActivityMapper'
      - $ref: '#/components/schemas/manualActivityMapper'
      - $ref: '#/components/schemas/gameplayActivityMapper'
    activityAllocationMapper:
      allOf:
        - $ref: '#/components/schemas/activityMapper'
        - type: object
          required:
            - session_status
            - allocated_user_id
            - allocated_username
            - allocated_isToken
            - allocated_token
          properties:
            session_status:
              type: string
              enum: ["created", "active", "inactive", "terminated"]
              example: "paused"
            allocated_user_id:
              type: integer
              example: 456
            allocated_username:
              type: string
              example: "participant1"
            allocated_isToken:
              type: boolean
              example: false
            allocated_token: 
              type: string
              example: "abc123"
    activity_type:
      type: object
      required:
        - activity_name
        - activity_type
        - activity_description
        - activity_utils
      properties:
        activity_name:
          type: string
          example: "LimeSurvey Activity"
        activity_type:
          type: string
          example: "limesurvey"
        activity_description:
          type: string
          example: "A survey-based activity that uses LimeSurvey as service."
        activity_utils:
          type: object
          additionalProperties: true
    activityInitializedMapper:
      type: object
      description: Key/value object to store the initialization data of the simlet
      additionalProperties:
        type: boolean
        nullable: true
    activityProgressMapper:
      type: object
      description: Key/value object to store the progress data of the activity
      additionalProperties:
        type: number
        nullable: true
    activityCompletionMapper:
      type: object
      description: Key/value object to store the completion data of the activity
      additionalProperties:
        type: boolean
        nullable: true
    activitySuspensionMapper:
      type: object
      description: Key/value object to store the suspension data of the activity
      additionalProperties:
        type: boolean
        nullable: true
    activityHasResultMapper:
      type: object
      description: Key/value object to store the has result data of the activity
      additionalProperties:
        type: boolean
    activityOpenableMapper:
      type: object
      required:
        - openable
      properties:
        openable:
          type: boolean
          example: true
    activityTargetMapper:
      type: object
      description: Key/value object to store the target data of the activity (e.g., url of the resource to open)
      additionalProperties:
        type: string
    activityResultMapper:
      type: object
      description: Key/value object to store the result data of the activity (e.g., score, completion status, etc.)
      additionalProperties:
        type: string
    allocator_type:
      type: object
      required:
        - allocator_name
        - allocator_type
        - allocator_description
        - allocator_utils
      properties:
        allocator_name:
          type: string
          example: "Group Allocator"
        allocator_type:
          type: string
          example: "group"
        allocator_description:
          type: string
          example: "This allocator allows you to select to which session branch is each group assigned."
        allocator_utils:
          type: object
          additionalProperties: true
    lti_tool:
      type: object
      properties:
        id:
          type: string
          example: ObjectId("5d07a0767c1405004bc702b2")
        name:
          type: string
          example: "Session tool"
        description:
          type: string
          example: "This is a test tool used for testing"
        client_id:
          type: string
          example: "lti-tool-client-12345"
        url:
          type: string
          example: "https://lti-tool.test/"
        jwks_uri:
          type: string
          example: "https://lti-tool.test/.well-known/jwks.json"
        login_uri:
          type: string
          example: "https://lti-tool.test/oidc/init"
        redirect_uri:
          type: string
          example: "https://lti-tool.test/launch"
        extra_data:
          type: object
    lti_platform:
      type: object
      properties:
        id:
          type: string
          example: ObjectId("5d07a0767c1405004bc702b2")
        url:
          type: string
          example: "https://sso.simva.e-ucm.es/auth/realms/simva"
        name:
          type: string
          example: "simva"
        clientId:
          type: string
          example: "lti-tool-81751"
        authenticationEndpoint:
          type: string
          example: "https://sso.simva.e-ucm.es/auth/realms/simva/protocol/openid-connect/auth"
        accesstokenEndpoint:
          type: string
          example: "https://sso.simva.e-ucm.es/auth/realms/simva/protocol/openid-connect/token"
        authConfig:
          type: object
          #example: { "method": "JWK_SET", "key": "https://sso.simva.e-ucm.es/auth/realms/simva/protocol/openid-connect/certs" }
        internal_id:
          type: string
          example: ObjectId("5d07a0767c1405004bc702b2")
        extra_data:
          type: object
    lti_context:
      type: object
      properties:
        id:
          type: string
          example: ObjectId("5d07a0767c1405004bc702b2")
        org:
          type: string
          example: "https://lti-tool.test/oidc/init"
        type:
          type: array
          items:
            type: string
            example: "http://purl.imsglobal.org/vocab/lis/v2/course#CourseOffering"
        label:
          type: string
          example: "lti-tool-client-12345"
        title:
          type: string
          example: "https://lti-tool.test/"
        sourcedId:
          type: string
          example: "activity:5d07a0767c1405004bc702b2"
        history:
          type: string
          example: "A comma-separated list of URL-encoded context ID values representing previous copies of the context"
    lti_status:
      required:
      - tool
      - platform
      type: object
      properties:
        username:
          type: boolean
          example: true
        password:
          type: boolean
          example: false
    link_accounts:
      required:
      - main
      - secondary
      type: object
      properties:
        main:
          type: string
          example: JWT of the main account
        secondary:
          type: string
          example: JWT of the secondary account
        domain:
          type: string
          example: moodle_12321    
