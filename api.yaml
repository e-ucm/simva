openapi: 3.0.0
info:
  description: Simva, AKA Simple Validator, AKA SurveyManager is the evolution
    of a tool created to integrate and ease the task of validating serious games
    using pre-post surveys as a control point. This version allows to create more
    complex studies with more variety of activities and different allocations.
  version: "2.0.0"
  title: Simva API
  contact:
    email: jsantila@ucm.es
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
    
tags:
  - name: admins
    description: Secured Admin-only calls
  - name: teachers
    description: Operations available to teachers
  - name: students
    description: Operations available to students
  - name: noroles
    description: Operations available to users with no role
  - name: lrsmanagers
    description: Operations available to users that manage lrs
paths:
  /health:
    get:
      summary: health check endpoint
      operationId: getHealth
      description: |
        Simple health check endpoint to verify that the API is running
      responses:
        '200':
          description: Service is healthy
  /events:
    get:
      summary: send Server Side Events to Client
      operationId: GetEvent
      description: |
        send Server Side Events to Client
      responses:
        '200':
          description: Event processed
        '400':
          description: 'invalid input, object invalid'
        '401':
          description: 'One or both of the JWT are not valid'
        required: true
  /limesurvey-completion-webhooks:
    post:
      summary: get completion from limesurvey
      operationId: GetEvent
      description: |
        get completion from limesurvey
      responses:
        '200':
          description: completion from limesurvey
        '400':
          description: 'invalid input, object invalid'
        '401':
          description: 'One or both of the JWT are not valid'
        required: true
  /users:
    get:
      tags:
        - admins
      summary: gets the list of users.
      operationId: getUsers
      description: |
        Obtains the list of users owned by current user.
      responses:
        '200':
          description: the list of users
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/user'
      parameters:
        - $ref: '#/components/parameters/searchString'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
    patch:
      summary: Modifies the logged user, for exemple it's role.
      tags:
        - admins
        - noroles
      operationId: patchUser
      description: |
        Modifies the logged user, for exemple it new role to be added to the user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userBody'
      parameters:
        - $ref: '#/components/parameters/username'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
        '400':
          description: 'invalid input, object invalid'
  /users/me:
    get:
      tags:
        - admins
        - teachers
        - students
      summary: Obtains your own user.
      operationId: getMe
      description: |
        Based on the current auth header obtains the user
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
        '400':
          description: 'invalid input'
  /users/link:
    post:
      summary: Links the secondary account to the main one
      operationId: linkUser
      description: |
        Receives two valid JWT tokens and adds to the main
        account, as an external_entity, the secondary account
      responses:
        '200':
          description: Accounts linked
        '400':
          description: 'invalid input, object invalid'
        '401':
          description: 'One or both of the JWT are not valid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/link_accounts'
        required: true
  /users/events:
    post:
      summary: Receives the events of the SSO to sync the users
      operationId: eventUser
      description: |
        Receives the SSO events and updates the users, both creating
        the users and updating their roles and permissions 
      responses:
        '200':
          description: Event processed
        '400':
          description: 'invalid input, object invalid'
        '401':
          description: 'One or both of the JWT are not valid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/events'
        required: true
  /users/{username}:
    patch:
      tags:
        - admins
        - teachers
      summary: updates a user
      operationId: patchUserByUsername
      description: |
        Updates the specified user's information
      responses:
        '200':
          description: user updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
        '400':
          description: 'invalid input, object invalid'
        '404':
          description: 'user not found'
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          description: Username of the user to update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user'
        required: true
  /groups:
    get:
      tags:
        - admins
        - teachers
        - students
      summary: gets the list of groups where this student pl
      operationId: getGroups
      description: |
        Obtains the list of groups owned by current user.
      responses:
        '200':
          description: the list of groups for this user
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/group'
      parameters:
        - $ref: '#/components/parameters/searchString'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
    post:
      tags:
        - teachers
      summary: adds a group for the current user as owner.
      operationId: createGroup
      description: |
        Creates a new group for the current user as owner.
      responses:
        '200':
          description: group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group'
        '400':
          description: 'invalid input, object invalid'
        '409':
          description: an existing item already exists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/add_group_body'
        required: true
  /groups/{id}:
    get:
      tags:
        - admins
        - students
        - teachers
      summary: gets the group with the given ID
      operationId: getGroup
      description: |
        Obtains the requested group
      responses:
        '200':
          description: group object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group'
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Not found'
      parameters:
        - $ref: '#/components/parameters/groupId'
    put:
      tags:
        - teachers
      summary: updates the group
      operationId: updateGroup
      description: Updates an existing group
      responses:
        '200':
          description: item created
        '401':
          description: 'Teacher does not own the group'
        '400':
          description: 'invalid input'
      parameters:
        - $ref: '#/components/parameters/groupId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/group'
        description: Group to be modified
    delete:
      tags:
        - teachers
      summary: delete the group
      operationId: deleteGroup
      description: delete an existing group
      responses:
        '200':
          description: deleted group
        '401':
          description: 'Teacher does not own the group'
        '400':
          description: 'invalid input'
      parameters:
        - $ref: '#/components/parameters/groupId'
  /groups/{id}/simlets:
    get:
      tags:
        - teachers
      summary: gets the assigned studies to the group
      operationId: getGroupStudies
      description: |
        Obtains the list of studies assigned to the group
      responses:
        '200':
          description: list of studies assigned
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/study'
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Group not found'
      parameters:
        - $ref: '#/components/parameters/groupId'
  /tasklist:
    post:
      tags:
        - teachers
      summary: add to the task list
      operationId: addToTaskList
      description: |
        Add an action to the task list
      responses:
        '200':
          description: added to task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Task added successfully"
        '400':
          description: 'invalid input, object invalid'
  /groups/{id}/participants:
    get:
      tags:
        - teachers
      summary: gets the list of participants for this group
      operationId: getGroupParticipants
      description: |
        Obtains the list of participants of the group
      responses:
        '200':
          description: list of participants
          content:
            application/json:
              schema:
                type: array
                items: 
                  type: string
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Group not found'
      parameters:
        - $ref: '#/components/parameters/groupId'
    post:
      summary: adds a user.
      tags:
        - teachers
      operationId: addUser
      description: |
        Creates a new user for the current group.
      responses:
        '200':
          description: item created
        '400':
          description: 'invalid input, object invalid'
        '409':
          description: an existing item already exists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user'
        required: true
  /groups/count:
    get:
      tags:
        - admins
        - teachers
      summary: gets the total count of groups
      operationId: getGroupCount
      description: |
        Gets the total number of groups available to the current user
      responses:
        '200':
          description: group count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 42
        '400':
          description: 'invalid input'
  /groups/{id}/participants/{participant_id}:
    delete:
      tags:
        - teachers
      summary: deletes a user.
      operationId: deleteUser
      description: |
        Deletes a user from the current group.
      responses:
        '200':
          description: item deleted
        '400':
          description: 'invalid input, object invalid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user'
        required: true
  /groups/{group_id}/permissions:
    get:
      tags:
        - admins
        - teachers
      summary: gets permissions for a group
      operationId: getGroupPermissions
      description: |
        Gets all user permissions for the specified group
      responses:
        '200':
          description: group permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/user_permission'
        '400':
          description: 'invalid input, object invalid'
        '404':
          description: 'group not found'
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the group
  /groups/{group_id}/permissions/{user_id}:
    get:
      tags:
        - admins
        - teachers
      summary: gets permissions for a user in a group
      operationId: getGroupPermissionsForUser
      description: |
        Gets permissions for a specific user in the specified group
      responses:
        '200':
          description: user permissions for group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_permission'
        '400':
          description: 'invalid input, object invalid'
        '404':
          description: 'group or user not found'
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the group
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user
    patch:
      tags:
        - admins
        - teachers
      summary: updates permissions for a user in a group
      operationId: patchGroupPermissionsForUser
      description: |
        Updates permissions for a specific user in the specified group
      responses:
        '200':
          description: permissions updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_permission'
        '400':
          description: 'invalid input, object invalid'
        '404':
          description: 'group or user not found'
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the group
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_permission'
        required: true
    delete:
      tags:
        - admins
        - teachers
      summary: deletes permissions for a user in a group
      operationId: deleteGroupPermissionsForUser
      description: |
        Deletes permissions for a specific user in the specified group
      responses:
        '200':
          description: permissions deleted
        '400':
          description: 'invalid input, object invalid'
        '404':
          description: 'group or user not found'
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the group
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user
  /simlets:
    get:
      tags:
        - admins
        - teachers
        - students
      summary: gets the list of studies for the current teacher
      operationId: getStudies
      description: |
        Obtains the list of studies for the current teacher.
      responses:
        '200':
          description: the list of studies for this teacher
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/study'
      parameters:
        - $ref: '#/components/parameters/searchString'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
    post:
      tags:
        - teachers
      summary: adds an study for the current teacher
      operationId: addStudy
      description: |
        Creates a new study for the current teacher.
      responses:
        '200':
          description: study created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/study'
        '400':
          description: 'invalid input, object invalid'
        '409':
          description: an existing item already exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/add_study_body'
        description: Study to be created
  /simlets/import:
    post:
        tags:
          - teachers
        summary: adds an study for the current teacher
        operationId: addStudyFromImport
        description: |
          Creates a new study for the current teacher.
        responses:
          '200':
            description: study created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/study'
          '400':
            description: 'invalid input, object invalid'
          '409':
            description: an existing item already exists
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upload_file'
          description: Study to be created
  /simlets/{simletid}:
    get:
      tags:
        - admins
        - teachers
      summary: gets the study with the given ID
      operationId: getStudy
      description: |
        Obtains the requested study
      responses:
        '200':
          description: study object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/study'
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Not found'
      parameters:
        - $ref: '#/components/parameters/studyId'
    put:
      tags:
        - teachers
      summary: updates the study
      operationId: patchSimlet
      description: Updates an existing stidy
      responses:
        '200':
          description: item created
        '401':
          description: 'Teacher does not own the class'
        '400':
          description: 'invalid input'
        '404':
          description: 'Requested study does not exist'
      parameters:
        - $ref: '#/components/parameters/studyId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/study'
        description: study to be modified
    delete:
      tags:
        - teachers
      summary: Deletes the study with the given ID
      operationId: deleteSimlet
      description: |
        Deleted the designed study
      responses:
        '200':
          description: Study deleted
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Not found'
      parameters:
        - $ref: '#/components/parameters/studyId'
  /simlets/{simletid}/export:
    get:
      tags:
        - admins
        - teachers
      summary: gets the study export with the given ID
      operationId: getStudyExport
      description: |
        Obtains the requested study Export
      responses:
        '200':
          description: study object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/study'
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Not found'
      parameters:
        - $ref: '#/components/parameters/studyId'
  /simlets/{simletid}/events:
    get:
      summary: send Server Side Events to Client for this study
      operationId: GetEvent
      description: |
        send Server Side Events to Client
      responses:
        '200':
          description: Event processed
        '400':
          description: 'invalid input, object invalid'
        '401':
          description: 'One or both of the JWT are not valid'
      parameters:
        - $ref: '#/components/parameters/studyId'
  /simlets/{simletid}/events/getPresignedUrl:
    get:
      tags:
        - teachers
      summary: get getPresignedUrl for Server Side Events to Client for this study
      operationId: getEventsPresignedUrl
      description: |
        get getPresignedUrl Server Side Events to Client
      responses:
        '200':
          description: Event processed
        '400':
          description: 'invalid input, object invalid'
        '401':
          description: 'One or both of the JWT are not valid'
      parameters:
        - $ref: '#/components/parameters/studyId'
  /simlets/{simletid}/schedule:
    get:
      tags:
        - teachers
        - students
      summary: gets the list of scheduled activities for the student
      operationId: getSchedule
      description: |
        Obtains the list of scheduled activities for the current
        student and study, and its completion status. Hides the
        current used test to the user.
      responses:
        '200':
          description: The list of scheduled activities in order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: "The next activity ID"
                activities: 
                  type: array
                  items:
                    $ref: '#/components/schemas/activity'
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Not found'
      parameters:
        - $ref: '#/components/parameters/studyId'
  /simlets/{simletid}/schedule/events:
    get:
      summary: send Server Side Events to Client for this study
      operationId: GetEvent
      description: |
        send Server Side Events to Client
      responses:
        '200':
          description: presigned URL
        '400':
          description: 'invalid input, object invalid'
        '401':
          description: 'One or both of the JWT are not valid'
      parameters:
        - $ref: '#/components/parameters/studyId'
  /simlets/{simletid}/schedule/events/getPresignedUrl:
    get:
      tags:
        - teachers
        - students
      summary: get getPresignedUrl for Server Side Events to Client for this study
      operationId: getScheduleEventsPresignedUrl
      description: |
        get getPresignedUrl Server Side Events to Client
      responses:
        '200':
          description: presigned URL
        '400':
          description: 'invalid input, object invalid'
        '401':
          description: 'One or both of the JWT are not valid'
      parameters:
        - $ref: '#/components/parameters/studyId'
  /simlets/{simletid}/groups:
    get:
      tags:
        - admins
        - teachers
      summary: gets the assigned groups to the study
      operationId: getSimletGroups
      description: |
        Obtains the list of groups assigned to the study
      responses:
        '200':
          description: list of groups assigned
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/group'
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Study not found'
      parameters:
        - $ref: '#/components/parameters/studyId'
  /simlets/{simletid}/sessions:
    get:
      tags:
        - teachers
      summary: gets the tests from a study
      operationId: getSimletSessions
      description: |
        Obtains the list of tests assigned to the study
      responses:
        '200':
          description: list of tests assigned
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/test'
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Study not found'
      parameters:
        - $ref: '#/components/parameters/studyId'
    post:
      tags:
        - teachers
      summary: adds a test to the study
      operationId: createSimletSession
      description: |
        Adds a test for the current group
      responses:
        '200':
          description: test created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/test'
        '400':
          description: 'invalid input, object invalid'
      parameters:
        - $ref: '#/components/parameters/studyId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/test'
        required: true
  /simlets/{simletid}/participants:
    get:
      tags:
        - teachers
      summary: gets the list of participants for this study
      operationId: getSimletParticipants
      description: |
        Obtains the list of participants of the study
      responses:
        '200':
          description: list of participants
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/simlet_participant'
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'study not found'
      parameters:
        - $ref: '#/components/parameters/studyId'
  /simlets/{simletid}/sessions/{sessionid}:
    get:
      tags:
        - teachers
      summary: gets the test with the given ID
      operationId: getTest
      description: |
        Obtains the requested test
      responses:
        '200':
          description: test object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/test'
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Not found'
      parameters:
        - $ref: '#/components/parameters/simletId'
        - $ref: '#/components/parameters/sessionId'
    put:
      tags:
        - teachers
      summary: updates the test
      operationId: updateTest
      description: Updates an existing test
      responses:
        '200':
          description: item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/test'
        '401':
          description: 'Teacher does not own the class'
        '400':
          description: 'invalid input'
        '404':
          description: 'Requested study does not exist'
      parameters:
        - $ref: '#/components/parameters/simletId'
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/test'
        description: test to be modified
    patch:
      summary: Modifies the test.
      tags:
        - teachers
      operationId: patchTest
      description: |
        Modifies the test
      parameters:
        - $ref: '#/components/parameters/simletId'
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/test'
      responses:
        '200':
          description: Test updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/test'
        '401':
          description: 'Teacher does not own the class'
        '400':
          description: 'invalid input'
        '404':
          description: 'Requested study does not exist'
    delete:
      tags:
        - teachers
      summary: deletes the test with the given ID
      operationId: deleteTest
      description: |
        Deleted the selected test
      responses:
        '200':
          description: success
        '400':
          description: 'ID is not a valid ObjectId'
        '404':
          description: 'Not found'
      parameters:
        - $ref: '#/components/parameters/simletId'
        - $ref: '#/components/parameters/sessionId'
  /simlets/{simletid}/sessions/{sessionid}/participants:
    get:
      tags:
        - teachers
      summary: gets the list of participants for this session
      operationId: getSimletParticipants
      description: |
        Obtains the list of participants of the session
      responses:
        '200':
