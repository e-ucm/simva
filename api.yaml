        properties:
          user_id:
            type: integer
            example: 456
          username:
            type: string
            example: "teacher1"
          isCurrentUser:
            type: boolean
            example: true
    group:
      type: object
      properties:
        simlet_id:
          type: integer
          example: 123
        group_name:
          type: string
          example: "Session group for School"
        group_use_new_generation:
