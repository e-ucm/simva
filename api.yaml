          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
      parameters:
        - $ref: '#/components/parameters/ltiPlatformId'
  /uploads:
    post:
      tags:
        - teachers
      summary: adds a lti tool
      operationId: uploadLtiTool
      description: |
        Adds an lti tool that will be later available for the activities
      responses:
        '200':
          description: lti tool created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lti_tool'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/lti_tool'
        required: true
security:
  - OAuth2.0:
      - openid
      - profile
      - email
components:
  securitySchemes:
    OAuth2.0:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://sso.simva-beta2.e-ucm.es/realms/simva/protocol/openid-connect/auth
          tokenUrl: https://sso.simva-beta2.e-ucm.es/realms/simva/protocol/openid-connect/token
          scopes:
            openid: Grants access to the OpenID Connect ID token
            profile: Grants access to the user's profile information
            email: Grants access to the user's email address
      x-client-id: "{{clientId}}"
      x-client-secret: "{{clientSecret}}"
      x-callback-url: "https://oauth.pstmn.io/v1/callback"
  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The ID of the resource
    userId:
      in: path
      name: userid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The user ID
    groupId:
      in: path
      name: groupid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The group ID
    usernamePath:
      name: username
      in: path
      required: true
      schema:
        type: string
        example: "peter"
        format: username
      description: The username of a specific user
    usernameQuery:
      name: username
      in: query
      required: true
      schema:
        type: string
        example: "peter"
        format: username
      description: The username of a specific user
    simletId:
      in: path
      name: simletid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The SIMLET ID
    sessionId:
      in: path
      name: sessionid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The session ID
    activityId:
      in: path
      name: activityid
      required: true
      schema:
        type: integer
        example: 1234567890
      description: The activity ID
    extensionId:
      in: path
      name: extension_id
      required: true
      schema:
        type: string
      description: Extension identifier
    ltiToolId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702b2"
      description: The lti_tool ID
    ltiPlatformId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702b2"
      description: The lti platform ID
    contextId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702af"
      description: The context id
    lineItem:
      in: path
      name: lineitem
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702af"
      description: The id of the line item
    searchString:
      in: query
      name: searchString
      description: pass an optional search string for result filtering
      required: false
      schema:
        type: string
    skip:
      in: query
      name: skip
      description: number of records to skip for pagination
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    limit:
      in: query
      name: limit
      description: maximum number of records to return
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 50
    user:
      in: query
      name: user
      description: |
        the user to get its completion status
        (if logged in student , user is not needed)
      schema:
        type: string
        format: 'user1'
    users:
      in: query
      name: users
      description: |
        the list of users comma separated or none for all
        (if logged in student , user is not needed)
      schema:
        type: string
        example: 'user1,user2,user3'
    type:
      in: query
      name: type
      description: |
        If the activity has multiple types of results, the
        type of result can be specified here
      required: false
      schema:
        type: string
        example: 'results'
    time:
      in: query
      name: time
      description: |
        milliseconds to return
      required: false
      schema:
        type: integer
        format: '2000'
    lti_login_hint:
      in: query
      name: lti_login_hint
      description: simva signed JWT token with LTI-login data
      required: false
      schema:
        type: string
    lti_message_hint:
      in: query
      name: lti_message_hint
      description: simva signed JWT token with LTI-related data
      required: false
      schema:
        type: string
    use_new_generation:
      in: query
      name: use_new_generation
      required: false
      schema:
        type: boolean
      description: |
        If true, the new generation of groups will be used
    token:
      in: query
      name: token
      description: |
        the jwt token to authenticate the user for which the information is required for testing purposes
      schema:
        type: string
        format: 'token1'
    keycloakDelete:
      in: query
      name: keycloakDelete
      description: |
        If true, the user will be deleted also in keycloak. Only for testing purposes
      schema:
        type: boolean
  responses:
    HealthCheckSuccess:
      description: Health check successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/health_check_response'
    AuthentificationError:
      description: Authentification error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    BadRequestError:
      description: Bad request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    ConflictError:
      description: Conflict error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    NotFoundError:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    NotImplementedError:
      description: Not implemented method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  schemas:
    health_check_response:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: boolean
          example: true
        db:
          type: object
          required:
            - status
          properties:
            status:
              type: boolean
              example: true
    error:
      description: An error occurred
      type: object
      required:
        - type
        - message
        - stack
        - name
      properties:
        type:
          type: string
          example: "Error"
        message:
          type: string
          example: "An error occurred"
        stack:
          type: string
          example: "Error: An error occurred at ... "
        name:
          type: string
          example: "Error"
    upload_file:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
    events:
      required:
      - eventname
      type: object
      properties:
        name:
          type: string
          example: eventname
          description: |
            The event name.
    user:
      type: object
      properties:
        username:
          type: string
          example: "username_unique"
        isToken:
          type: boolean
          example: false
        token:
          type: string
          nullable: true
          example: "user"
        email:
          type: string
          example: "email@example.com"
        role:
          type: string
          description: |
            The role for the user to have. Some
            examples include teacher, student 
            teaching-assistant or researcher
          enum:
           - "norole"
           - "student"
           - "teacher"
           - "teaching-assistant"
           - "researcher"
           - "admin"
           - "lrsmanager"
    tokenCreation:
      allOf:
        - $ref: '#/components/schemas/user'
        - type: object
          required:
            - isToken
            - token
            - role
    userPasswordCreation:
      allOf:
        - $ref: '#/components/schemas/user'
        - type: object
          properties:
            password:
              type: string
              example: "Pass12345"
          required:
            - username
            - isToken
            - email
            - role
    userCreation:
      oneOf:
        - $ref: '#/components/schemas/tokenCreation'
        - $ref: '#/components/schemas/userPasswordCreation'
    userMapper:
      allOf:
       - $ref: '#/components/schemas/user'
       - type: object
         properties:
          user_id:
            type: integer
            example: 123
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
         required:
          - user_id
          - username
          - isToken
          - token
          - email
          - role
          - createdAt
          - updatedAt
    userPermission:
      type: object
      properties:
        username:
          type: string
          example: "teacher1"
        permission:
          type: string
          example: "READ_WRITE"
    userPermissionCreation:
      allOf:
      - $ref: '#/components/schemas/userPermission'
      - type: object
        required:
        - username
        - permission
    userPermissionMapper:
      allOf:
      - $ref: '#/components/schemas/userPermission'
      - type: object
        required:
          - user_id
          - username
          - permission
          - isCurrentUser
        properties:
          user_id:
            type: integer
            example: 456
          isCurrentUser:
            type: boolean
            example: true
    group:
      type: object
      properties:
        simlet_id:
          type: integer
          example: 123
        group_name:
          type: string
          example: "Session group for School"
        group_use_new_generation:
          type: boolean
          example: true
        group_allocator_type:
          type: string
          enum : ["default", "session", "group", "random"]
          example: "default"
        group_sandbox:
          type: boolean
          example: false
    groupCreation:
      allOf:
      - $ref: '#/components/schemas/group'
      - type: object
        required:
        - group_name
        - group_use_new_generation
        - group_sandbox
    groupAllocatorRandomizeSessionAllocation:
      type: array
      items:
        type: object
        properties:
          session_id:
            type: integer
            example: 123
          percentage:
            type: integer
            example: 50
    groupMapper:
      allOf:
      - $ref: '#/components/schemas/group'
      - type: object
        required:
          - simlet_id
          - group_id
          - group_name
          - group_use_new_generation
          - group_allocator_type
          - group_sandbox
          - group_owner_user_id
          - group_owner_username
          - createdAt
          - updatedAt
          - participants
          - allocations
        properties:
          groupid:
            type: integer
            example: 123
          group_owner_user_id:
            type: integer
            example: 456
          group_owner_username:
            type: string
            example: "teacher1"
          createdAt:
            type: string
            format: date-time
            example: "2017-07-21T17:32:28Z"
          updatedAt:
            type: string
            format: date-time
            example: "2017-07-21T17:32:28Z"
          participants:
              type: array
              items:
                type: integer
                example: 123
          allocations:
            type: object
            additionalProperties:
              type: integer
              nullable: false
              example: 123
          randomize_session_allocation:
            $ref: '#/components/schemas/groupAllocatorRandomizeSessionAllocation'
    simlet:
      type: object
      properties:
        simlet_name:
          type: string
          example: "Survey for SG validation"
        simlet_description:
          type: string
          example: "A comprehensive simlet for serious game validation"
        simlet_archived:
          type: boolean
          example: false
    simletCreation:
        allOf:
        - $ref: '#/components/schemas/simlet'
        - type: object
          required:
          - simlet_name
          - simlet_description
          - simlet_archived
    simletUpdate:
        allOf:
        - $ref: '#/components/schemas/simlet'
        - type: object
          properties:
            sessions:
              type: array
              items:
                type: integer
    simletMapper:
        allOf:
        - $ref: '#/components/schemas/simlet'
        - type: object
          required:
            - simlet_id
            - simlet_name
            - simlet_description
            - simlet_archived
            - createdAt
            - updatedAt
            - current_user_id
            - current_user_username
            - current_user_permission
            - sessions
            - groups
            - tags
          properties:        
            simlet_id:
              type: integer
              example: 123
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            current_user_id:
              type: integer
              example: 456
            current_user_username:
              type: string
              example: "researcher1"
            current_user_permission:
              type: string
              example: "READ_WRITE"
            sessions:
              type: array
              items:
                type: integer
            groups:
              type: array
              items:
                type: integer
            tags:
              type: array
              items:
                $ref: '#/components/schemas/tagsMapper'
    tags:
      type: object
      properties:
        tag_name:
          type: string
          example: "tag1"
        tag_color:
          type: string
          example: "#FF5733"
    tagsCreation:
      allOf:
      - $ref: '#/components/schemas/tags'
      - type: object
        required:
        - tag_name
        - tag_color
    tagsMapper:
      allOf:
      - $ref: '#/components/schemas/tags'
      - type: object
        required:
          - tag_id
          - tag_name
          - tag_color
          - createdAt
          - updatedAt
        properties:
          tag_id:
            type: integer
            example: 123
          createdAt:
            type: string
            format: date-time
            example: "2017-07-21T17:32:28Z"
          updatedAt:
            type: string
            format: date-time
            example: "2017-07-21T17:32:28Z"
    # Simlet and session participants
    participantMapper:
