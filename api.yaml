security:
  - OAuth2:
      - read
      - write
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://sso.simva.e-ucm.es/auth/realms/simva/protocol/openid-connect/auth
          tokenUrl: https://sso.simva.e-ucm.es/auth/realms/simva/protocol/openid-connect/token
          scopes:
            read: Grants read access
            write: Grants write access
  parameters:
    groupId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702af"
      description: The group ID
    username:
      name: username
      in: path
      required: true
      schema:
        type: string
        example: "peter"
      format: username
      description: The username of a specific user
    simletId:
      in: path
      name: simletid
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702af"
      description: The SIMLET ID
    sessionId:
      in: path
      name: sessionid
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702at"
      description: The session ID
    searchString:
      in: query
      name: searchString
      description: pass an optional search string for result filtering
      required: false
      schema:
        type: string
    skip:
      in: query
      name: skip
      description: number of records to skip for pagination
      schema:
        type: integer
        format: int32
        minimum: 0
    limit:
      in: query
      name: limit
      description: maximum number of records to return
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 50
    user:
      in: query
      name: user
      description: |
        the user to get its completion status
        (if logged in student , user is not needed)
      schema:
        type: string
        format: 'user1'
    users:
      in: query
      name: users
      description: |
        the list of users comma separated or none for all
        (if logged in student , user is not needed)
      schema:
        type: string
        format: 'user1,user2,user3'
    activityId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702af"
      description: The activity ID
    type:
      in: query
      name: type
      description: |
        If the activity has multiple types of results, the
        type of result can be specified here
      schema:
        type: string
        format: 'backup'
    time:
      in: query
      name: time
      description: |
        milliseconds to return
      schema:
        type: integer
        format: '2000'
    lti_login_hint:
      in: query
      name: lti_login_hint
      description: simva signed JWT token with LTI-login data
      required: false
      schema:
        type: string
    lti_message_hint:
      in: query
      name: lti_message_hint
      description: simva signed JWT token with LTI-related data
      required: false
      schema:
        type: string
    contextId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702af"
      description: The context id
    lineItem:
      in: path
      name: lineitem
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702af"
      description: The id of the line item
    ltiToolId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702b2"
      description: The lti_tool ID
    ltiPlatformId:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: "5d07a0767c1405004bc702b2"
      description: The lti platform ID
  properties:
    username:
      type: string
      example: "username_unique"
    email:
      type: string
      example: "email"
    password:
      type: string
      example: "Pass12345"
    role:
      type: string
      description: |
        The role for the user to have. Some
        examples include teacher, student 
        teaching-assistant or researcher
      enum:
       - "norole"
       - "student"
       - "teacher"
       - "teaching-assistant"
       - "researcher"
       - "admin"
    external_entity:
      type: array
      items:
        type: object
        properties:
          domain:
            type: string
            example: keycloak
          id:
            type: string
            example: whateveruuidusedthere_12321
    id:
      type: string
      example: ObjectId("5d07a0767c1405004bc702af")
    name:
      type: string
      example: "Test group for School"
    owners:
      type: array
      items:
        type: string
        example: ObjectId("5d07a0767c1405004bc702af")
    participants:
      type: array
      items:
        type: string
        example: ObjectId("5d07a0767c1405004bc702af")
    link:
      type: object
    created:
      type: string
      format: date-time
      example: "2017-07-21T17:32:28Z"
  schemas:
    user:
      type: object
      required:
        - username
        - email
        - role
      properties:
        user_id:
          type: integer
          example: 123
        username:
          type: string
          example: "username_unique"
        email:
          type: string
          example: "email@example.com"
        role:
          type: string
          description: |
            The role for the user to have. Some
            examples include teacher, student 
            teaching-assistant or researcher
          enum:
           - "norole"
           - "student"
           - "teacher"
           - "teaching-assistant"
           - "researcher"
           - "admin"
           - "lrsmanager"
        isToken:
          type: boolean
          example: false
        token:
          type: string
          example: "user"
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    userBody:
      type: object
      properties:
        username:
          type: string
          example: "username_unique"
        email:
          type: string
          example: "email"
        role:
          type: string
          description: |
            The role for the user to have. Some
