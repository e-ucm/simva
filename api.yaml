openapi: 3.0.0
info:
  description: Simva, AKA Simple Validator, AKA SurveyManager is the evolution
    of a tool created to integrate and ease the task of validating serious games
    using pre-post surveys as a control point. This version allows to create more
    complex studies with more variety of activities and different allocations.
  version: "2.0.0"
  title: Simva API
  contact:
    email: jsantila@ucm.es
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'

servers:
  - url: https://{baseUrl}
    description: SIMVA API Server
    variables:
      baseUrl:
        default: localhost:3000
        description: Base URL for the API
    
tags:
  - name: administrators
    description: Secured Admin-only calls
  - name: teachers
    description: Operations available to teachers
  - name: students
    description: Operations available to students
  - name: noroles
    description: Operations available to users with no role
  - name: lrsmanagers
    description: Operations available to users that manage lrs
paths:
  /health:
    get:
      summary: health check endpoint
      operationId: healthCheck
      description: |
        Simple health check endpoint to verify that the API is running
      responses:
        '200':
          $ref: '#/components/responses/HealthCheckSuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    head:
      summary: Health check (HEAD)
      operationId: healthCheckHead
      responses:
        '200':
          $ref: '#/components/responses/HealthCheckSuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events:
    get:
      summary: send Server Side Events to Client
      operationId: sendEvent
      description: |
        send Server Side Events to Client
      responses:
        '200':
          description: Event processed
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /limesurvey-completion-webhooks:
    post:
      summary: get completion from limesurvey
      operationId: getLimesurveyEvent
      description: |
        get completion from limesurvey
      responses:
        '200':
          description: completion from limesurvey
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Message treated
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users:
    get:
      tags:
        - administrators
        - teachers
      summary: gets the list of users.
      operationId: getUsers
      description: |
        Obtains the list of users owned by current user.
      responses:
        '200':
          description: the list of users
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: 
                      $ref: '#/components/schemas/userMapper'
                  - $ref: '#/components/schemas/userMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/usernameQuery'
        - $ref: '#/components/parameters/searchString'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
    patch:
      summary: Modifies the logged user, for exemple it's role.
      tags:
        - administrators
        - noroles
      operationId: patchUser
      description: |
        Modifies the logged user, for exemple it new role to be added to the user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user'
      parameters:
        - $ref: '#/components/parameters/usernameQuery'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      tags:
        - administrators
        - lrsmanagers
        - teachers
        - students
        - noroles
      summary: Obtains your own user.
      operationId: getMe
      description: |
        Based on the current auth header obtains the user
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/link:
    post:
      summary: Links the secondary account to the main one
      operationId: linkAccount
      description: |
        Receives two valid JWT tokens and adds to the main
        account, as an external_entity, the secondary account
      responses:
        '200':
          description: accounts linked successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/link_accounts'
  /users/events:
    post:
      summary: Receives the events of the SSO to sync the users
      operationId: getUserEvents
      description: |
        Receives the SSO events and updates the users, both creating
        the users and updating their roles and permissions 
      responses:
        '200':
          description: events processed successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/events'
  /users/{username}:
    patch:
      tags:
        - administrators
        - teachers
        - noroles
      summary: updates a user
      operationId: patchUserByUsername
      description: |
        Updates the specified user's information
      responses:
        '200':
          description: user updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/usernamePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user'
  /groups:
    get:
      tags:
        - administrators
        - teachers
        - students
      summary: gets the list of groups where this student plays
      operationId: getGroups
      description: |
        Obtains the list of groups owned by current user.
      responses:
        '200':
          description: the list of groups for this user
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/groupMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/searchString'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/use_new_generation'
  /tasklist:
    post:
      tags:
        - administrators
        - teachers
      summary: add to the task list
      operationId: addToTaskList
      description: |
        Add an action to the task list
      responses:
        '200':
          description: added to task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Task added successfully"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /simlets:
    get:
      tags:
        - administrators
        - teachers
      summary: gets the list of studies for the current teacher
      operationId: getAllSimlets
      description: |
        Obtains the list of studies for the current teacher.
      responses:
        '200':
          description: the list of studies for this teacher
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/simletMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/searchString'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
    post:
      tags:
        - administrators
        - teachers
      summary: adds an simlet for the current teacher
      operationId: createSimlet
      description: |
        Creates a new simlet for the current teacher.
      responses:
        '201':
          description: simlet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/simletMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        # required: true removed, not valid in responses
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/simletCreation'
        description: Simlet to be created
  /simlets/scheduler:
    get:
      tags:
        - administrators
        - teachers
        - students
      summary: gets the list of scheduler entries for the current user
      operationId: getAllSchedulerSimlets
      description: |
        Obtains the list of scheduler entries for the current user.
      responses:
        '200':
          description: the list of scheduler entries for the current user
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/simletMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/searchString'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
  /simlets/import:
    post:
        tags:
          - administrators
          - teachers
        summary: adds an simlet for the current teacher
        operationId: addSimletFromImport
        description: |
          Creates a new simlet for the current teacher.
        responses:
          '200':
            description: simlet created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/simletMapper'
          '400':
            $ref: '#/components/responses/BadRequestError'
          '401':
            $ref: '#/components/responses/AuthentificationError'
          '404':
            $ref: '#/components/responses/NotFoundError'
          '406':
            $ref: '#/components/responses/ValidationError'
          '409':
            $ref: '#/components/responses/ConflictError'
          '500':
            $ref: '#/components/responses/InternalServerError'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upload_file'
  /simlets/{simletid}:
    get:
      tags:
        - administrators
        - teachers
      summary: gets the simlet with the given ID
      operationId: getSimletById
      description: |
        Obtains the requested simlet
      responses:
        '200':
          description: simlet object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/simletMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
    patch:
      tags:
        - administrators
        - teachers
      summary: updates the simlet
      operationId: patchSimlet
      description: Updates an existing simlet
      responses:
        '200':
          description: item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/simletMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/simletUpdate'
        description: simlet to be modified
    delete:
      tags:
        - administrators
        - teachers
      summary: Deletes the simlet with the given ID
      operationId: deleteSimlet
      description: |
        Deleted the designed simlet
      responses:
        '200':
          description: simlet deleted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
  /simlets/{simletid}/export:
    get:
      tags:
        - administrators
        - teachers
      summary: gets the simlet export with the given ID
      operationId: getSimletExport
      description: |
        Obtains the requested simlet Export
      responses:
        '200':
          description: simlet object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/simletMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
  /simlets/{simletid}/events:
    get:
      tags:
        - administrators
        - teachers
      summary: send Server Side Events to Client for this simlet
      operationId: limesurveyCompletionWebhook
      description: |
        send Server Side Events to Client
      responses:
        '200':
          description: Event processed
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
  /simlets/{simletid}/events/getPresignedUrl:
    get:
      tags:
        - administrators
        - teachers
      summary: get getPresignedUrl for Server Side Events to Client for this simlet
      operationId: getEventsPresignedUrl
      description: |
        get getPresignedUrl Server Side Events to Client
      responses:
        '200':
          description: Event processed
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
  /simlets/{simletid}/schedule:
    get:
      tags:
        - administrators
        - teachers
        - students
      summary: gets the list of scheduled activities for the student
      operationId: getSchedule
      description: |
        Obtains the list of scheduled activities for the current
        student and simlet, and its completion status. Hides the
        current used session to the user.
      responses:
        '200':
          description: The list of scheduled activities in order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduleMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
  /simlets/{simletid}/schedule/events:
    get:
      tags:
        - administrators
        - teachers
        - students
      summary: send Server Side Events to Client for this simlet
      operationId: GetSSEEvent
      description: |
        send Server Side Events to Client
      responses:
        '200':
          description: presigned URL
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
  /simlets/{simletid}/schedule/events/getPresignedUrl:
    get:
      tags:
        - administrators
        - teachers
        - students
      summary: get getPresignedUrl for Server Side Events to Client for this simlet
      operationId: getScheduleEventsPresignedUrl
      description: |
        get getPresignedUrl Server Side Events to Client
      responses:
        '200':
          description: presigned URL
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
  /simlets/{simletid}/shlink:
    get:
      tags:
        - administrators
        - teachers
      summary: gets the shlink URL for the simlet
      operationId: getSimletShlink
      description: |
        Obtains the shlink URL for the simlet
      responses:
        '200':
          description: shlink URL obtained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shlinkMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
    post:
      tags:
        - administrators
        - teachers
      summary: creates a shlink URL for the simlet
      operationId: createSimletShlink
      description: |
        Creates a shlink URL for the simlet
      responses:
        '200':
          description: shlink URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shlinkMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shlink'
    patch:
      tags:
        - administrators
        - teachers
      summary: updates the shlink URL for the simlet
      operationId: updateSimletShlink
      description: |
        Updates the shlink URL for the simlet
      responses:
        '200':
          description: shlink URL updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shlinkMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shlink'
    delete:
      tags:
        - administrators
        - teachers
      summary: deletes the shlink URL for the simlet
      operationId: deleteSimletShlink
      description: |
        Deletes the shlink URL for the simlet
      responses:
        '204':
          description: shlink URL deleted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
  /simlets/{simletid}/groups:
    get:
      tags:
        - administrators
        - teachers
      summary: gets the assigned groups to the simlet
      operationId: getSimletGroups
      description: |
        Obtains the list of groups assigned to the simlet
      responses:
        '200':
          description: list of groups assigned
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/groupMapper'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthentificationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/simletId'
        - $ref: '#/components/parameters/searchString'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/use_new_generation'
    post:
      tags:
        - administrators
        - teachers
      summary: adds a group for the current user as owner.
      operationId: createGroup
      description: |
        Creates a new group for the current user as owner.
      responses:
        '200':
          description: group created
          content:
            application/json:
