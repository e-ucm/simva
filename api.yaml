          activities:
            type: array
            items:
              type: integer
          tags:
            type: array
            items:
              $ref: '#/components/schemas/tagsMapper'
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    noTypedActivity:
