          enum: ["default", "manual", "limesurvey", "gameplay", "lti_tool"]
          example: "limesurvey"
        activity_trace_storage:
          type: boolean
          example: true
        activity_comply_with_GDPR:
          type: boolean
          example: true
          description: "Whether the activity complies with GDPR regulations. Has to be true if the activity collects data."
        activity_can_be_restarted:
          type: boolean
          example: false
          description: "Whether the activity can be restarted"
    noTypedActivityCreation:
      allOf:
      - $ref: '#/components/schemas/noTypedActivity'
      - type: object
        required:
        - activity_name
        - activity_type
        - activity_trace_storage
        - activity_can_be_restarted
    noTypedActivityMapper:
      allOf:
      - $ref: '#/components/schemas/noTypedActivity'
      - type: object
        required:
            - session_id
            - activity_id
            - activity_order
            - activity_name
            - activity_type
            - activity_trace_storage
            - activity_description
            - activity_comply_with_GDPR
            - activity_can_be_restarted
            - allocated_user
            - createdAt
            - updatedAt
        properties:
          session_id:
            type: integer
            example: 201
          activity_id:
            type: integer
            example: 301
          activity_order:
            type: integer
            example: 1
          activity_presignedUrl:
            type: string
            nullable: true
            example: "https://example.com/presigned-url"
          activity_presignedUrl_generated_at:
            type: string
            format: date-time
            nullable: true
          activity_presignedUrl_expires_at:
            type: string
            format: date-time
            nullable: true
          allocated_user:
            type: boolean
            example: false
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
