            example: 201
          simlet_id:
            type: integer
            example: 123
          current_user_id:
            type: integer
            example: 456
          current_user_username:
            type: string
            example: "researcher1"
          current_user_permission:
            type: string
            example: "READ_WRITE"
          session_status:
            type: string
            enum: ["created", "active", "inactive", "terminated"]
