    gameplay_activity:
      allOf:
        - $ref: '#/components/schemas/activity'
        - type: object
          properties:
            backup:
              type: boolean
              example: false
            scorm_xapi_by_game:
              type: boolean
              example: false
            category_id:
              type: integer
              example: 5
            subject_area_id:
              type: integer
              example: 3
            game_type:
              type: string
              example: "adventure"
            game_url:
              type: string
              example: "https://game.example.com/play"
    limesurvey_activity:
      allOf:
        - $ref: '#/components/schemas/activity'
        - type: object
          properties:
            survey_id:
              type: integer
              example: 123456
            language:
              type: string
              example: "en"
            lrsset:
              type: integer
              example: 1
    manual_activity:
      allOf:
        - $ref: '#/components/schemas/activity'
        - type: object
          properties:
            user_managed:
              type: boolean
              example: false
            ressource_type:
              type: string
              example: "document"
            ressource_url:
              type: string
              example: "https://example.com/resource.pdf"
    # Group and User related schemas
    group_participant:
      type: object
      required:
        - group_id
        - participant_id
        - username
      properties:
        group_id:
          type: integer
          example: 123
        participant_id:
          type: integer
          example: 456
        username:
          type: string
          example: "student1"
        token:
          type: string
          example: "abc123token"
        isToken:
          type: boolean
          example: false
        role:
          type: string
          example: "student"
        email:
          type: string
          example: "student1@example.com"
    user_permission:
      type: object
      required:
        - username
        - permission
      properties:
        username:
          type: string
          example: "teacher1"
        permission:
          type: string
          example: "READ_WRITE"
    # Allocator type schemas
    random_allocator:
      allOf:
        - $ref: '#/components/schemas/allocator'
        - type: object
          properties:
            name:
              type: string
              example: "Random Allocator"
            description:
              type: string
              example: "An allocator that randomly assigns users to sessions."
    group_allocator:
      allOf:
        - $ref: '#/components/schemas/allocator'
        - type: object
          properties:
            name:
              type: string
              example: "Group Allocator"
            description:
              type: string
              example: "This allocator allows you to select to which test branch is each group assigned."
    session_allocator:
      allOf:
        - $ref: '#/components/schemas/allocator'
        - type: object
          properties:
            name:
              type: string
              example: "Session Allocator"
            description:
              type: string
              example: "Allocates participants to specific sessions based on session parameters."
    # Study and session participants
    simlet_participant:
      type: object
      required:
        - simlet_id
        - user_id
      properties:
        simlet_id:
          type: integer
          example: 123
        user_id:
          type: integer
          example: 456
        username:
          type: string
          example: "student1"
        email:
          type: string
          example: "student1@example.com"
        role:
          type: string
          example: "student"
        allocated_group:
          type: string
          example: "control"
        allocation_date:
          type: string
          format: date-time
    simlet_group:
      type: object
      required:
        - simlet_id
        - group_id
      properties:
        simlet_id:
          type: integer
          example: 123
        group_id:
          type: integer
          example: 456
        group_name:
          type: string
          example: "Control Group A"
        use_new_generation:
          type: boolean
          example: true
        participant_count:
          type: integer
          example: 25
        assigned_date:
          type: string
          format: date-time
        permission:
          type: string
          example: "READ"
