          type: integer
          description: |
            The amount of codes to be created
            randomly when the group is created
          example: 30
      x-swagger-mongoose:
        exclude-schema: true
    add_study_body:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          example: Name of the Study
      x-swagger-mongoose:
        exclude-schema: true
    add_study_to_group_body:
      required:
      - study
