          type: string
          example: "Pre-session session for baseline measurement"
        session_can_be_manually_activated:
          type: boolean
          example: true
    sessionCreation:
      allOf:
      - $ref: '#/components/schemas/session'
      - type: object
        required:
        - session_name
        - session_description
        - session_can_be_manually_activated
    sessionUpdate:
      allOf:
      - $ref: '#/components/schemas/session'
      - type: object
        properties:
          activities:
            type: array
