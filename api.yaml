          enum:
           - "norole"
           - "student"
           - "teacher"
           - "teaching-assistant"
           - "researcher"
           - "admin"
        external_entity:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
                example: keycloak
              id:
                type: string
                example: whateveruuidusedthere_12321
    group:
      type: object
      required:
        - group_id
        - group_name
        - group_use_new_generation
      properties:
        group_id:
          type: integer
          example: 123
        group_name:
          type: string
          example: "Test group for School"
        group_use_new_generation:
          type: boolean
          example: true
        participants:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: integer
              username:
                type: string
          nullable: true
        group_owner_user_id:
          type: integer
          example: 456
        group_owner_username:
          type: string
          example: "teacher1"
        createdAt:
          type: string
          format: date-time
          example: "2017-07-21T17:32:28Z"
        updatedAt:
          type: string
          format: date-time
          example: "2017-07-21T17:32:28Z"
    study:
      type: object
      required:
        - simlet_id
        - simlet_name
      properties:
        simlet_id:
          type: integer
          example: 123
        simlet_name:
          type: string
          example: "Survey for SG validation"
        simlet_description:
          type: string
          example: "A comprehensive study for serious game validation"
        current_user_id:
          type: integer
          example: 456
        current_user_username:
          type: string
          example: "researcher1"
        current_user_permission:
          type: string
          example: "READ_WRITE"
        allocator_id:
          type: integer
          example: 789
          nullable: true
        sessions:
          type: array
          items:
            type: object
            properties:
              session_id:
                type: integer
              session_name:
                type: string
          nullable: true
        groups:
          type: array
          items:
            type: object
            properties:
              group_id:
                type: integer
              group_name:
                type: string
          nullable: true
        tags:
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
              name:
                type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    test:
      type: object
      required:
        - session_id
        - simlet_id
      properties:
        session_id:
          type: integer
          example: 201
        simlet_id:
          type: integer
          example: 123
        current_user_id:
          type: integer
          example: 456
        current_user_username:
          type: string
          example: "researcher1"
        current_user_permission:
          type: string
          example: "READ_WRITE"
        session_name:
          type: string
          example: "Test A for my study"
        session_description:
          type: string
          example: "Pre-test session for baseline measurement"
        session_experimental_method:
          type: string
          example: "control"
        session_can_be_manually_activated:
          type: boolean
          example: true
        session_active:
          type: boolean
          example: false
        session_start_date:
          type: string
          format: date-time
          nullable: true
        session_end_date:
          type: string
          format: date-time
          nullable: true
        activities:
          type: array
          items:
            type: object
            properties:
              activity_id:
                type: integer
              activity_name:
                type: string
          nullable: true
        tags:
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
              name:
                type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    activity:
      type: object
      required:
        - activity_id
        - session_id
        - activity_type
        - activity_name
      properties:
        session_id:
          type: integer
          example: 201
        activity_id:
          type: integer
          example: 301
        activity_name:
          type: string
          example: "Pre-survey activity"
        activity_type:
          type: string
          enum: ["default", "manual", "limesurvey", "gameplay", "lti_tool"]
          example: "limesurvey"
        activity_order:
          type: integer
          example: 1
        trace_storage:
          type: boolean
          example: true
        restart:
          type: boolean
          example: false
          description: "Whether the activity can be restarted"
        description:
          type: string
          example: "Survey for validation"
        activity_open_date:
          type: string
          format: date-time
          nullable: true
        activity_close_date:
          type: string
          format: date-time
          nullable: true
        activity_url:
          type: string
          nullable: true
          example: "https://example.com/activity"
        activity_extra_data:
          type: string
          nullable: true
          description: "JSON string containing extra configuration data"
        start_completion_policy:
          type: string
          nullable: true
        end_completion_policy:
          type: string
          nullable: true
        lrs_user:
          type: string
          nullable: true
        lrs_password:
          type: string
          nullable: true
        activity_can_be_restarted:
          type: boolean
          example: false
        activity_allow_anonymous_lrs_read:
          type: boolean
          example: false
        activity_can_check_completion_status:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    activityBody:
      type: object
      properties:
        id:
          type: string
          example: ObjectId("5d07a0767c1405004bc702af")
        name:
          type: string
          example: "Survey for validation"
        type:
          type: string
          example: "survey, gameplay, etc..."
    activity_type:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: "LimeSurvey Activity"
        type:
          type: string
          example: "limesurvey"
        description:
          type: string
          example: "A survey-based activity that uses LimeSurvey as service."
        utils:
          type: object
          additionalProperties: true
    allocator_type:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: "Group Allocator"
        type:
          type: string
          example: "group"
        description:
          type: string
          example: "This allocator allows you to select to which test branch is each group assigned."
        utils:
          type: object
          additionalProperties: true
    allocator:
      type: object
      required:
        - allocator_id
        - simlet_id
        - allocator_type
      properties:
        allocator_id:
          type: integer
          example: 401
        simlet_id:
          type: integer
          example: 123
        allocator_type:
          type: string
          example: "random"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    lti_tool:
      type: object
      required:
        - name
        - description
        - url
        - jwks_uri
        - login_uri
        - redirect_uri
      properties:
        id:
          type: string
          example: ObjectId("5d07a0767c1405004bc702b2")
        name:
          type: string
          example: "Test tool"
        description:
          type: string
          example: "This is a test tool used for testing"
        client_id:
          type: string
          example: "lti-tool-client-12345"
        url:
          type: string
          example: "https://lti-tool.test/"
        jwks_uri:
          type: string
          example: "https://lti-tool.test/.well-known/jwks.json"
        login_uri:
          type: string
          example: "https://lti-tool.test/oidc/init"
        redirect_uri:
          type: string
          example: "https://lti-tool.test/launch"
        extra_data:
          type: object
    lti_platform:
      type: object
      required:
        - url
        - name
        - clientId
        - authenticationEndpoint
        - accesstokenEndpoint
        - authConfig
      properties:
        id:
          type: string
          example: ObjectId("5d07a0767c1405004bc702b2")
        url:
          type: string
          example: "https://sso.simva.e-ucm.es/auth/realms/simva"
        name:
          type: string
          example: "simva"
        clientId:
          type: string
          example: "lti-tool-81751"
        authenticationEndpoint:
          type: string
          example: "https://sso.simva.e-ucm.es/auth/realms/simva/protocol/openid-connect/auth"
        accesstokenEndpoint:
          type: string
          example: "https://sso.simva.e-ucm.es/auth/realms/simva/protocol/openid-connect/token"
        authConfig:
          type: object
          #example: { "method": "JWK_SET", "key": "https://sso.simva.e-ucm.es/auth/realms/simva/protocol/openid-connect/certs" }
        internal_id:
          type: string
          example: ObjectId("5d07a0767c1405004bc702b2")
        extra_data:
          type: object
    lti_context:
      type: object
      required:
        - org
        - type
        - label
        - title
        - sourcedId
        - history
      properties:
        id:
          type: string
          example: ObjectId("5d07a0767c1405004bc702b2")
        org:
          type: string
          example: "https://lti-tool.test/oidc/init"
        type:
          type: array
          items:
            type: string
            example: "http://purl.imsglobal.org/vocab/lis/v2/course#CourseOffering"
        label:
          type: string
          example: "lti-tool-client-12345"
        title:
          type: string
          example: "https://lti-tool.test/"
        sourcedId:
          type: string
          example: "activity:5d07a0767c1405004bc702b2"
        history:
          type: string
          example: "A comma-separated list of URL-encoded context ID values representing previous copies of the context"
    upload_file:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
      x-swagger-mongoose:
        exclude-schema: true
    events:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          example: eventname
          description: |
            The event name.
      x-swagger-mongoose:
        exclude-schema: true
    add_group_body:
      required:
      - name
      type: object
      properties:
        name:
