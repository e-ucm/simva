name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  services:
    name: Build and health-check simva-api
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image and check health
        run: bash .github/scripts/ci-services.sh

  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The lint script is `tsc --noEmit`: the API ships as compiled JavaScript,
      # so a type error is a broken release.
      - name: Lint (type-check)
        run: npm run lint

      - name: Test
        run: npm test

  docker:
    name: Build Docker image
    needs: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the production stage so a broken Dockerfile fails the pipeline,
      # without pushing anywhere. Publishing happens on tags (see docker-publish.yml).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          tags: simva-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
